<script src="../three-d-stage.js"></script>
<script type="module">
const stage = document.querySelector('three-d-stage');
const { THREE } = await stage.ready;

/* ── procedural stone: value-noise height → normal + roughness ───────── */
function noiseCanvas(size, octaves){
  const c = document.createElement('canvas'); c.width = c.height = size;
  const x = c.getContext('2d');
  const h = new Float32Array(size * size);
  let amp = 1, total = 0;
  for (let o = 0; o < octaves; o++){
    const cells = 4 << o, grid = new Float32Array((cells + 1) * (cells + 1));
    for (let i = 0; i < grid.length; i++) grid[i] = Math.random();
    for (let py = 0; py < size; py++){
      const gy = py / size * cells, y0 = Math.floor(gy), fy = gy - y0;
      const sy = fy * fy * (3 - 2 * fy);
      for (let px = 0; px < size; px++){
        const gx = px / size * cells, x0 = Math.floor(gx), fx = gx - x0;
        const sx = fx * fx * (3 - 2 * fx);
        const a = grid[y0 * (cells + 1) + x0], b = grid[y0 * (cells + 1) + x0 + 1];
        const cc = grid[(y0 + 1) * (cells + 1) + x0], d = grid[(y0 + 1) * (cells + 1) + x0 + 1];
        h[py * size + px] += amp * ((a + (b - a) * sx) + ((cc + (d - cc) * sx) - (a + (b - a) * sx)) * sy);
      }
    }
    total += amp; amp *= 0.52;
  }
  for (let i = 0; i < h.length; i++) h[i] /= total;
  return { ctx: x, canvas: c, h, size };
}

function stoneMaps(size){
  const { canvas, ctx, h } = noiseCanvas(size, 5);
  // normal from sobel on the height field
  const img = ctx.createImageData(size, size);
  const at = (x, y) => h[((y + size) % size) * size + ((x + size) % size)];
  for (let y = 0; y < size; y++) for (let x = 0; x < size; x++){
    const dx = (at(x + 1, y) - at(x - 1, y)) * 5.5;
    const dy = (at(x, y + 1) - at(x, y - 1)) * 5.5;
    let nx = -dx, ny = -dy, nz = 1;
    const l = Math.hypot(nx, ny, nz); nx /= l; ny /= l; nz /= l;
    const i = (y * size + x) * 4;
    img.data[i] = (nx * .5 + .5) * 255;
    img.data[i + 1] = (ny * .5 + .5) * 255;
    img.data[i + 2] = (nz * .5 + .5) * 255;
    img.data[i + 3] = 255;
  }
  ctx.putImageData(img, 0, 0);
  const normal = new THREE.CanvasTexture(canvas);
  normal.wrapS = normal.wrapT = THREE.RepeatWrapping;
  normal.repeat.set(1.6, 1.6);

  // roughness variance from the same field
  const rc = document.createElement('canvas'); rc.width = rc.height = size;
  const rx = rc.getContext('2d'); const rimg = rx.createImageData(size, size);
  for (let i = 0; i < h.length; i++){
    const v = 190 + h[i] * 58;
    rimg.data[i * 4] = rimg.data[i * 4 + 1] = rimg.data[i * 4 + 2] = v;
    rimg.data[i * 4 + 3] = 255;
  }
  rx.putImageData(rimg, 0, 0);
  const rough = new THREE.CanvasTexture(rc);
  rough.wrapS = rough.wrapT = THREE.RepeatWrapping;
  rough.repeat.set(1.6, 1.6);
  return { normal, rough };
}

/* ── environment: warm dusk sky, drives glass + metal reflections ────── */
function skyEnv(renderer){
  const w = 1024, h = 512;
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  const x = c.getContext('2d');
  const g = x.createLinearGradient(0, 0, 0, h);
  g.addColorStop(0, '#5E86AE'); g.addColorStop(.34, '#9DC0DA');
  g.addColorStop(.49, '#E7D3BB'); g.addColorStop(.5, '#C3B49A');
  g.addColorStop(.72, '#9C917C'); g.addColorStop(1, '#6E685B');
  x.fillStyle = g; x.fillRect(0, 0, w, h);
  // soft cloud banding above the horizon
  for (let i = 0; i < 26; i++){
    const cy = h * (.08 + Math.random() * .34), cw = 90 + Math.random() * 280, ch = 12 + Math.random() * 34;
    const cx = Math.random() * w;
    const cg = x.createRadialGradient(cx, cy, 0, cx, cy, cw);
    cg.addColorStop(0, 'rgba(255,246,234,.55)'); cg.addColorStop(1, 'rgba(255,246,234,0)');
    x.fillStyle = cg; x.save(); x.translate(cx, cy); x.scale(1, ch / cw); x.translate(-cx, -cy);
    x.beginPath(); x.arc(cx, cy, cw, 0, Math.PI * 2); x.fill(); x.restore();
  }
  // sun
  const sx = w * .64, sy = h * .3;
  const sg = x.createRadialGradient(sx, sy, 0, sx, sy, 150);
  sg.addColorStop(0, 'rgba(255,252,242,1)'); sg.addColorStop(.18, 'rgba(255,238,210,.85)');
  sg.addColorStop(1, 'rgba(255,238,210,0)');
  x.fillStyle = sg; x.beginPath(); x.arc(sx, sy, 150, 0, Math.PI * 2); x.fill();

  const tex = new THREE.CanvasTexture(c);
  tex.mapping = THREE.EquirectangularReflectionMapping;
  tex.colorSpace = THREE.SRGBColorSpace;
  const pmrem = new THREE.PMREMGenerator(renderer);
  pmrem.compileEquirectangularShader();
  const env = pmrem.fromEquirectangular(tex).texture;
  pmrem.dispose(); tex.dispose();
  return env;
}

const renderer = stage._renderer;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.06;
const env = skyEnv(renderer);
stage._scene.environment = env;

/* studio relight: one warm key from the upper left, cool sky fill */
stage._key.intensity = 2.75;
stage._key.color.set('#FFF1DC');
stage._key.position.set(-7.5, 6.8, 9.5);
stage._key.shadow.radius = 3;
stage._scene.traverse(o => { if (o.isHemisphereLight) o.intensity = 0.55; });
stage._ground.material.opacity = 0.13;

/* ── materials ───────────────────────────────────────────────────────── */
const { normal, rough } = stoneMaps(512);
const M = {};
M['stone-limestone'] = new THREE.MeshStandardMaterial({
  name:'stone-limestone', color:'#E1D8C7', roughness:.86, metalness:.02,
  normalMap: normal, normalScale: new THREE.Vector2(.5,.5), roughnessMap: rough, envMapIntensity:.7
});
M['stone-trim'] = new THREE.MeshStandardMaterial({
  name:'stone-trim', color:'#F2ECE1', roughness:.72, metalness:.02,
  normalMap: normal, normalScale: new THREE.Vector2(.3,.3), envMapIntensity:.8
});
M['glass-glazing'] = new THREE.MeshPhysicalMaterial({
  name:'glass-glazing', color:'#7E97AC', roughness:.018, metalness:.58,
  transmission:.1, thickness:.04, ior:1.55, transparent:true, opacity:.98,
  clearcoat:1, clearcoatRoughness:.015, reflectivity:1, envMapIntensity:2.2, side:THREE.DoubleSide
});
M['metal-mullion'] = new THREE.MeshStandardMaterial({
  name:'metal-mullion', color:'#4A453D', roughness:.36, metalness:.86, envMapIntensity:1.1
});
M['metal-railing'] = new THREE.MeshStandardMaterial({
  name:'metal-railing', color:'#C8CDD0', roughness:.19, metalness:.95, envMapIntensity:1.5
});
M['interior-void'] = new THREE.MeshStandardMaterial({
  name:'interior-void', color:'#14120F', roughness:.95, metalness:0
});

/* ── helpers ─────────────────────────────────────────────────────────── */
const box = (w, h, d, mat, name) => {
  const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), mat);
  m.name = name; return m;
};
const put = (m, x, y, z) => { m.position.set(x, y, z); return m; };

/* elevation panel: rectangle with real openings, extruded toward -Z,
   front face at z = 0 */
function panel(w, h, thick, holes, mat, name){
  const s = new THREE.Shape();
  s.moveTo(-w/2, 0); s.lineTo(w/2, 0); s.lineTo(w/2, h); s.lineTo(-w/2, h); s.closePath();
  holes.forEach(o => {
    const p = new THREE.Path();
    p.moveTo(o.x0, o.y0); p.lineTo(o.x1, o.y0); p.lineTo(o.x1, o.y1); p.lineTo(o.x0, o.y1); p.closePath();
    s.holes.push(p);
  });
  const g = new THREE.ExtrudeGeometry(s, { depth: thick, bevelEnabled: false, curveSegments: 4 });
  g.translate(0, 0, -thick);
  const m = new THREE.Mesh(g, mat); m.name = name; return m;
}

/* stoecke-riegel grid inside an opening, local XY, faces +Z */
function glazing(w, h, cols, rows, name){
  const gr = new THREE.Group(); gr.name = name;
  const pw = .042, pd = .11;
  const glass = new THREE.Mesh(new THREE.PlaneGeometry(w - .02, h - .02), M['glass-glazing']);
  glass.name = name + '-glass'; glass.position.z = -.035;
  gr.add(glass);
  const addBar = (bw, bh, x, y) => gr.add(put(box(bw, bh, pd, M['metal-mullion'], name + '-profile'), x, y, -pd/2 + .012));
  addBar(w, pw, 0, h/2 - pw/2); addBar(w, pw, 0, -h/2 + pw/2);
  addBar(pw, h, -w/2 + pw/2, 0); addBar(pw, h, w/2 - pw/2, 0);
  for (let i = 1; i < cols; i++) addBar(pw * .8, h, -w/2 + w * i / cols, 0);
  for (let j = 1; j < rows; j++) addBar(w, pw * .8, 0, -h/2 + h * j / rows);
  return gr;
}

/* perforated screen: extruded plate pierced by a diamond lattice */
function screen(w, h, name){
  const s = new THREE.Shape();
  s.moveTo(-w/2, -h/2); s.lineTo(w/2, -h/2); s.lineTo(w/2, h/2); s.lineTo(-w/2, h/2); s.closePath();
  const cols = 3, cell = w / cols, rows = Math.round(h / cell);
  const r = cell * .31;
  for (let j = 0; j < rows; j++) for (let i = 0; i < cols; i++){
    for (const off of [[0, 0], [.5, .5]]){
      const cx = -w/2 + cell * (i + .5 + off[0]), cy = -h/2 + (h/rows) * (j + .5 + off[1]);
      if (Math.abs(cx) > w/2 - r * .9 || Math.abs(cy) > h/2 - r * .9) continue;
      const p = new THREE.Path();
      p.moveTo(cx, cy - r); p.lineTo(cx + r * .62, cy); p.lineTo(cx, cy + r); p.lineTo(cx - r * .62, cy); p.closePath();
      s.holes.push(p);
    }
  }
  const g = new THREE.ExtrudeGeometry(s, { depth: .05, bevelEnabled: false, curveSegments: 2 });
  const m = new THREE.Mesh(g, M['stone-trim']); m.name = name; return m;
}

/* plan outline of the L-corner, offset outward by o */
function outline(o){
  const back = 3.95, depth = -0.78;   // back faces of the fragment
  const cz = o, cx = o, k = -1.2 + o * Math.SQRT2;   // x + z = k on the chamfer
  return [
    [-back, cz], [k - cz, cz], [cx, k - cx], [cx, -back],
    [depth, -back], [depth, depth], [-back, depth]
  ];
}
function extrudePlan(pts, height, y0, mat, name){
  const s = new THREE.Shape();
  pts.forEach(([x, z], i) => i ? s.lineTo(x, -z) : s.moveTo(x, -z));
  s.closePath();
  const g = new THREE.ExtrudeGeometry(s, { depth: height, bevelEnabled: false });
  g.rotateX(-Math.PI / 2); g.translate(0, y0, 0);
  const m = new THREE.Mesh(g, mat); m.name = name; return m;
}

/* ── the fragment ────────────────────────────────────────────────────── */
const FH = 3.3, WALL = 6.6, T = .34;
const model = new THREE.Group(); model.name = 'facade-corner';

// dark interior shell seen through the openings
model.add(extrudePlan(outline(-0.30), WALL + .3, .1, M['interior-void'], 'interior'));

/* — wing: inner edge at ±1.2, runs outward 2.6 m — */
function wing(dir, withBalcony){
  const g = new THREE.Group();
  const inner = 1.2 * dir, len = 2.6;
  const cx = inner + dir * len / 2;                  // panel centre
  const holes = [];
  const slotC = inner + dir * .62, slotW = .62;      // stair-hall glazed slot
  holes.push({ x0: Math.min(slotC - slotW/2, slotC + slotW/2), x1: Math.max(slotC - slotW/2, slotC + slotW/2), y0: .46, y1: 6.16 });
  const winC = inner + dir * 1.82, winW = 1.06;      // punched window, one per floor
  for (let f = 0; f < 2; f++){
    holes.push({ x0: winC - winW/2, x1: winC + winW/2, y0: .92 + f * FH, y1: 2.98 + f * FH });
  }
  const p = panel(len, WALL, T, holes.map(o => ({ x0: o.x0 - cx, x1: o.x1 - cx, y0: o.y0, y1: o.y1 })), M['stone-limestone'], 'wall');
  p.position.x = cx;
  g.add(p);

  // glazed slot + perforated screen in front of it
  const slot = glazing(slotW - .02, 5.7 - .02, 1, 8, 'stairhall');
  put(slot, slotC, .46 + 5.7/2, -.12); g.add(slot);
  const sc = screen(slotW + .16, 5.42, 'screen');
  put(sc, slotC, .46 + 5.7/2, .035); g.add(sc);

  // windows, sills, lintels
  for (let f = 0; f < 2; f++){
    const y = (.92 + 2.98) / 2 + f * FH;
    const w = glazing(winW - .02, 2.06 - .02, 2, 2, 'window');
    put(w, winC, y, -.1); g.add(w);
    g.add(put(box(winW + .3, .1, .16, M['stone-trim'], 'sill'), winC, .92 + f * FH - .05, .05));
    g.add(put(box(winW + .34, .13, .19, M['stone-trim'], 'lintel'), winC, 2.98 + f * FH + .07, .06));
  }

  if (withBalcony){
    const by = .92 + FH - .16;
    g.add(put(box(winW + 1.0, .15, .74, M['stone-trim'], 'balcony-slab'), winC, by, .36));
    const rg = new THREE.Group(); rg.name = 'railing';
    const bw = winW + .86, bd = .62, top = by + 1.05;
    const rail = (len2, rot, x, y2, z) => {
      const m = new THREE.Mesh(new THREE.CylinderGeometry(.021, .021, len2, 16), M['metal-railing']);
      m.name = 'railing-rail'; m.rotation.z = rot.z || 0; m.rotation.x = rot.x || 0;
      m.position.set(x, y2, z); rg.add(m);
    };
    rail(bw, { z: Math.PI/2 }, winC, top, .36 + bd/2);
    rail(bw, { z: Math.PI/2 }, winC, by + .55, .36 + bd/2);
    rail(bd, { x: Math.PI/2 }, winC - bw/2, top, .36);
    rail(bd, { x: Math.PI/2 }, winC + bw/2, top, .36);
    const n = 15;
    for (let i = 0; i <= n; i++){
      const m = new THREE.Mesh(new THREE.CylinderGeometry(.009, .009, 1.05, 10), M['metal-railing']);
      m.name = 'railing-baluster';
      m.position.set(winC - bw/2 + bw * i / n, by + 1.05/2 + .04, .36 + bd/2);
      rg.add(m);
    }
    for (const sgn of [-1, 1]){
      const post = new THREE.Mesh(new THREE.CylinderGeometry(.027, .027, 1.09, 16), M['metal-railing']);
      post.name = 'railing-post';
      post.position.set(winC + sgn * bw/2, by + 1.09/2 + .04, .36 + bd/2 - .0);
      rg.add(post);
    }
    g.add(rg);
  }
  return g;
}

const wingA = wing(-1, false); model.add(wingA);
const wingB = wing(1, true); wingB.rotation.y = Math.PI / 2; model.add(wingB);

/* — chamfer: the glazed corner bay — */
const CW = 1.2 * Math.SQRT2;
const chamfer = new THREE.Group();
chamfer.rotation.y = Math.PI / 4;
chamfer.position.set(-.6, 0, -.6);
{
  const openW = 1.16;
  chamfer.add(panel(CW, WALL, T, [{ x0: -openW/2, x1: openW/2, y0: .44, y1: 6.2 }], M['stone-limestone'], 'wall-chamfer'));
  const bay = glazing(openW - .02, 5.76 - .02, 3, 7, 'corner-bay');
  put(bay, 0, .44 + 5.76/2, -.1); chamfer.add(bay);
  chamfer.add(put(box(openW + .3, .12, .2, M['stone-trim'], 'bay-sill'), 0, .4, .06));
}
model.add(chamfer);

/* — pilasters at the two chamfer edges — */
for (const [px, pz, ry] of [[-1.2, 0, 0], [0, -1.2, Math.PI/2]]){
  const p = new THREE.Group(); p.rotation.y = ry; p.position.set(px, 0, pz);
  const shaft = box(.42, WALL - .1, .2, M['stone-trim'], 'pilaster');
  put(shaft, 0, (WALL - .1)/2, .07); p.add(shaft);
  p.add(put(box(.52, .16, .26, M['stone-trim'], 'pilaster-cap'), 0, WALL - .16, .09));
  p.add(put(box(.48, .1, .23, M['stone-trim'], 'pilaster-cap'), 0, WALL - .3, .08));
  p.add(put(box(.5, .18, .25, M['stone-trim'], 'pilaster-base'), 0, .1, .085));
  model.add(p);
}

/* — plinth and crowning cornice follow the plan outline — */
model.add(extrudePlan(outline(.07), .42, 0, M['stone-trim'], 'plinth'));
model.add(extrudePlan(outline(.045), .14, FH - .18, M['stone-trim'], 'belt-course'));
model.add(extrudePlan(outline(.05), .2, WALL - .02, M['stone-trim'], 'cornice-1'));
model.add(extrudePlan(outline(.17), .26, WALL + .17, M['stone-trim'], 'cornice-2'));
model.add(extrudePlan(outline(.06), .34, WALL + .42, M['stone-limestone'], 'parapet'));

stage.setObject(model);

/* ── framing + constrained orbit (a fragment, not a free object) ─────── */
const c = stage._controls, cam = stage._camera;
c.target.set(-.85, 3.5, -.85);
cam.position.set(6.6, 6.1, 7.7);
c.enablePan = false;
c.minDistance = 7.5; c.maxDistance = 19;
c.minPolarAngle = 0.62; c.maxPolarAngle = 1.52;
const az = Math.atan2(cam.position.x - c.target.x, cam.position.z - c.target.z);
c.minAzimuthAngle = az - 0.95; c.maxAzimuthAngle = az + 0.95;
c.rotateSpeed = 0.75; c.zoomSpeed = 0.6;
c.update();

/* ── hover a material row → that material lifts, the rest recede ─────── */
const base = {};
Object.entries(M).forEach(([k, m]) => { base[k] = m.envMapIntensity; });
const rows = [...document.querySelectorAll('.mat')];
function focus(key){
  rows.forEach(r => r.classList.toggle('on', !!key && r.dataset.mat === key));
  Object.entries(M).forEach(([k, m]) => {
    if (!key){ m.envMapIntensity = base[k]; m.emissive && m.emissive.setHex(0x000000); return; }
    const on = k === key;
    m.envMapIntensity = on ? base[k] * 1.5 : base[k] * .5;
    if (m.emissive) m.emissive.setHex(on ? 0x14100a : 0x000000);
    if (!on && m.color) m.userData.dim = true;
  });
}
rows.forEach(r => {
  r.addEventListener('mouseenter', () => focus(r.dataset.mat));
  r.addEventListener('focus', () => focus(r.dataset.mat));
  r.addEventListener('mouseleave', () => focus(null));
  r.addEventListener('blur', () => focus(null));
});
</script>
</body>
</html>
